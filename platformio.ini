; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
; 4 MB flash: 1 MB firmware (room for firmware updates via the web page), 2 MB LittleFS for the settings
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
extra_scripts = pre:tools/embed_web.py
lib_deps = 
	knolleary/PubSubClient@^2.8
	paulstoffregen/OneWire@^2.3.5
	milesburton/DallasTemperature@^3.9.1
	esp32async/ESPAsyncTCP@^2.0.0
	esp32async/ESPAsyncWebServer@^3.12.1
	ihormelnyk/OpenTherm Library@^1.1.5
	bblanchon/ArduinoJson@^7.2.2
lib_compat_mode = strict
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp8266_exception_decoder
